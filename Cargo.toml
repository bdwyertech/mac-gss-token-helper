[package]
name = "gss-token-helper"
version = "0.1.0"
edition = "2024"
description = "macOS SPNEGO token helper using GSS.framework"
license = "MIT"
repository = "https://github.com/bdwyertech/mac-gss-token-helper"

[lib]
name = "gss_token_helper"
path = "src/lib.rs"

[[bin]]
name = "gss-token-helper"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s" # use 3 for performance-critical applications

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "std", "help"], default-features = false }
clap_complete = "4.6"

[features]
ui-tests = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
trybuild = "1"

[build-dependencies]
built = { version = "0.8", features = [
    "cargo-lock",
    "chrono",
    "dependency-tree",
    "git2",
    "semver"
] }
